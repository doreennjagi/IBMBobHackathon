# OpenShift Deployment Configuration for SubLeech
# This manifest deploys both backend and frontend services

apiVersion: apps/v1
kind: Deployment
metadata:
  name: subleech-backend
  labels:
    app: subleech
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subleech
      component: backend
  template:
    metadata:
      labels:
        app: subleech
        component: backend
    spec:
      containers:
      - name: backend
        image: us.icr.io/subleech/backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: subleech-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: subleech-secrets
              key: redis-url
        - name: WATSONX_API_KEY
          valueFrom:
            secretKeyRef:
              name: subleech-secrets
              key: watsonx-api-key
        - name: WATSONX_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: subleech-config
              key: watsonx-project-id
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subleech-frontend
  labels:
    app: subleech
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subleech
      component: frontend
  template:
    metadata:
      labels:
        app: subleech
        component: frontend
    spec:
      containers:
      - name: frontend
        image: us.icr.io/subleech/frontend:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_BASE_URL
          value: "http://subleech-backend:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: subleech-backend
  labels:
    app: subleech
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: subleech
    component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: subleech-frontend
  labels:
    app: subleech
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: subleech
    component: frontend

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: subleech
  labels:
    app: subleech
spec:
  to:
    kind: Service
    name: subleech-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

