name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install fastapi uvicorn pandas numpy httpx pydantic sqlalchemy alembic psycopg2-binary python-multipart pytest pytest-asyncio PyJWT slowapi pyyaml pydantic-settings
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/test_pattern_detector.py -v
        env:
          DATABASE_URL: sqlite:///./test.db
          WATSONX_API_KEY: mock
          SECRET_KEY: test-secret-key
          ALLOWED_ORIGINS: http://localhost:5173

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Build
        run: cd frontend && npm run build
        continue-on-error: true
